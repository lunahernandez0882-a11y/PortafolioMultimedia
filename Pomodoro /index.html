<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro App · Pantalla de bienvenida</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="bienvenida.css">
</head>
<body>

  <main class="phone">

    
    <div class="bg-image"></div>
    <div class="bg-scrim"></div>

    <!-- Retícula de 3 filas iguales = regla de tercios -->
    <div class="grid-thirds">

      <!-- Tercio superior: marca -->
      <section class="third third-top">
      
      </section>

      <!-- Tercio medio: se deja "respirar", protagonismo para tu imagen de fondo -->
      <section class="third third-middle">
          
      </section>

      <!-- Tercio inferior: CTA -->
      <section class="third third-bottom">
          <p class="brand">🍅 Pomodoro</p>
        <p class="tagline">Concéntrate 25 minutos a la vez</p>
        <a href="pomodoro.html" class="cta-btn">
          Iniciar Pomodoro
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M8 5v14l11-7z" fill="#E8503A"/>
          </svg>
        </a>
        <p class="subtext">Toca el botón para comenzar tu primera sesión</p>
      </section>

    </div>

  </main>

</body>
</html>
